<meta charset="utf-8">
<title>Tidewall</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one fixed-ratio canvas stage, scaled to fit, with a one-line control hint under it. Single deep-reef look. */
:root {
  --abyss: #06222e;
  --deep: #0b3a4a;
  --sand: #e3be82;
  --coral: #ff7a6b;
  --foam: #e9fbf7;
  --kelp: #2f8f6a;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 0%, var(--deep), var(--abyss) 70%);
  background-color: var(--abyss);
  color: var(--foam);
  font-family: var(--body);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow: hidden;
}
#wrap { flex: 1; min-height: 0; width: 100%; max-width: 1240px; display: flex; align-items: center; justify-content: center; }
canvas { display: block; border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(233,251,247,.08); touch-action: manipulation; cursor: pointer; }
canvas:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
.hint { font-size: 13px; letter-spacing: .02em; opacity: .72; text-align: center; text-wrap: balance; max-width: 70ch; }
.hint b { font-weight: 800; color: var(--sand); }
</style>

<div id="wrap"><canvas id="game" tabindex="0" aria-label="Tidewall game board"></canvas></div>
<p class="hint">Pick a creature card, then a sand tile. Tap pearls to collect them. Keys: <b>1–5</b> creatures, <b>S</b> shovel, <b>P</b> pause, <b>Esc</b> cancel.</p>

<script>
(() => {
const W = 1000, H = 620;
const GX = 170, GY = 118, CW = 88, CH = 96, COLS = 9, ROWS = 5;
const PEARL_POS = { x: 58, y: 46 };
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const r = document.getElementById('wrap').getBoundingClientRect();
  const s = Math.max(0.2, Math.min(r.width / W, r.height / H));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr * cv.width / Math.round(W * s * dpr), 0, 0, s * dpr * cv.height / Math.round(H * s * dpr), 0, 0);
}
addEventListener('resize', resize);

// ---------- definitions ----------
const PLANTS = {
  clam:   { name: 'Pearl Clam',    cost: 50,  cd: 7.5, hp: 300 },
  urchin: { name: 'Spine Urchin',  cost: 100, cd: 7.5, hp: 300 },
  frost:  { name: 'Frost Anemone', cost: 175, cd: 7.5, hp: 300 },
  coral:  { name: 'Brain Coral',   cost: 50,  cd: 30,  hp: 4000 },
  puffer: { name: 'Puffer',        cost: 150, cd: 35,  hp: 9999 },
};
const ORDER = ['clam', 'urchin', 'frost', 'coral', 'puffer'];
const FOES = {
  crab:   { hp: 200,  armor: 0,    speed: 17, dps: 100, cost: 1, from: 1, w: 3,   hw: 24 },
  eel:    { hp: 300,  armor: 0,    speed: 34, dps: 80,  cost: 2, from: 3, w: 2,   hw: 26 },
  bucket: { hp: 200,  armor: 1000, speed: 17, dps: 100, cost: 3, from: 4, w: 1.5, hw: 24 },
  blob:   { hp: 1500, armor: 0,    speed: 9,  dps: 220, cost: 5, from: 7, w: 1,   hw: 36 },
};
const TOTAL_WAVES = 10;
const cellX = c => GX + c * CW + CW / 2;
const groundY = r => GY + r * CH + CH / 2 + 28;
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- state ----------
let mode = 'title', paused = false, S;
function newGame() {
  S = {
    t: 0, pearls: 150,
    grid: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    foes: [], shots: [], pearlsF: [], fx: [],
    jets: Array.from({ length: ROWS }, () => ({ st: 'ready', x: GX - 36 })),
    cards: Object.fromEntries(ORDER.map(k => [k, 0])),
    sel: null, hover: null,
    wave: 0, waveT: 22, waveLen: 22, endless: false,
    nextSky: 5, spawnQ: [], kills: 0, banner: null,
  };
}
newGame();
const decor = Array.from({ length: 34 }, () => ({
  x: rand(GX + 6, GX + CW * COLS - 6), y: rand(GY + 10, GY + CH * ROWS - 6),
  k: Math.random() < .5 ? 'pebble' : 'shell', r: rand(2, 5), a: rand(0, 6),
}));
const bubbles = Array.from({ length: 26 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(1.5, 4.5), s: rand(10, 28), p: rand(0, 6) }));

// ---------- audio ----------
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = .07, slide = 0) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), n + d);
  g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  o.connect(g).connect(AC.destination); o.start(n); o.stop(n + d + .02);
}
function noise(d, v = .2, freq = 900) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, len, AC.sampleRate), data = b.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
  src.buffer = b; src.connect(f).connect(g).connect(AC.destination); src.start();
}

// ---------- helpers ----------
function fx(o) { S.fx.push(Object.assign({ vx: 0, vy: 0, life: .6, max: .6, r: 3, color: '#fff', type: 'dot', g: 0 }, o)); }
function burst(x, y, n, colors, spd = 120, g = 120) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * .3, spd);
    fx({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(.4, .9), r: rand(2, 5), color: colors[i % colors.length], g });
  }
}
function banner(text, sub) { S.banner = { text, sub, t: 2.6 }; }
function damage(f, amt) {
  if (f.armor > 0) {
    f.armor -= amt;
    if (f.armor <= 0) { f.hp += f.armor; f.armor = 0; burst(f.x, groundY(f.row) - 56, 10, ['#2f80ed', '#8cc0ff'], 160); tone(220, .15, 'square', .04, .5); }
  } else f.hp -= amt;
  f.hit = .1;
}

// ---------- waves ----------
function startWave() {
  S.wave++;
  const n = S.wave, flag = n % 5 === 0;
  let budget = Math.round(1 + n * 1.5 + (flag ? n * 1.2 : 0));
  const pool = Object.entries(FOES).filter(([, f]) => f.from <= n);
  let delay = 0;
  while (budget > 0) {
    const opts = pool.filter(([, f]) => f.cost <= budget);
    if (!opts.length) break;
    let tot = opts.reduce((s, [, f]) => s + f.w, 0), pick = Math.random() * tot, k = opts[0][0];
    for (const [key, f] of opts) { pick -= f.w; if (pick <= 0) { k = key; break; } }
    budget -= FOES[k].cost;
    S.spawnQ.push({ k, t: delay });
    delay += flag ? rand(.5, 1.2) : rand(1.2, 3.2);
  }
  if (flag) { banner('A huge tide is rising!', 'Tide ' + n); noise(.8, .12, 400); tone(110, .8, 'sawtooth', .05, .6); }
  else banner('Tide ' + n);
  S.waveLen = S.waveT = flag ? 32 : 24;
}
function spawnFoe(k) {
  const d = FOES[k];
  S.foes.push({ k, row: Math.floor(Math.random() * ROWS), x: W + rand(30, 60), hp: d.hp, armor: d.armor, slow: 0, hit: 0, anim: rand(0, 10), eating: false });
}

// ---------- update ----------
function update(dt) {
  for (const b of bubbles) { b.y -= b.s * dt; b.x += Math.sin(S.t * .8 + b.p) * 6 * dt; if (b.y < -10) { b.y = H + 10; b.x = rand(0, W); } }
  updateFx(dt);
  if (mode !== 'play' || paused) { if (mode === 'title') S.t += dt; return; }
  S.t += dt;
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
  for (const k of ORDER) S.cards[k] = Math.max(0, S.cards[k] - dt);

  // sky pearls
  S.nextSky -= dt;
  if (S.nextSky <= 0) {
    S.pearlsF.push({ x: rand(GX + 20, GX + CW * COLS - 20), y: -20, ty: rand(GY + 50, H - 50), v: 25, sky: true, vy: 0, life: 9, col: false, spin: rand(0, 6) });
    S.nextSky = rand(8, 11);
  }

  // waves
  const more = S.endless || S.wave < TOTAL_WAVES;
  if (more) {
    if (S.wave > 0 && !S.foes.length && !S.spawnQ.length && S.waveT > 5) S.waveT = 5;
    S.waveT -= dt;
    if (S.waveT <= 0) startWave();
  }
  for (const q of S.spawnQ) q.t -= dt;
  for (const q of S.spawnQ.filter(q => q.t <= 0)) spawnFoe(q.k);
  S.spawnQ = S.spawnQ.filter(q => q.t > 0);

  // plants
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = S.grid[r][c]; if (!p) continue;
    p.hit = Math.max(0, p.hit - dt); p.fire = Math.max(0, p.fire - dt * 4);
    p.timer -= dt;
    const cx = cellX(c), gy = groundY(r);
    if (p.k === 'clam' && p.timer <= 0) {
      S.pearlsF.push({ x: cx + rand(-14, 14), y: gy - 40, ty: gy - rand(4, 16), v: 25, sky: false, vy: -150, vx: rand(-30, 30), life: 9, col: false, spin: rand(0, 6) });
      p.timer = rand(10, 12);
      tone(880, .12, 'sine', .03, 1.4);
    }
    if ((p.k === 'urchin' || p.k === 'frost') && p.timer <= 0) {
      if (S.foes.some(f => f.row === r && f.x > cx - 10 && f.x < W - 8)) {
        S.shots.push({ row: r, x: cx + 22, y: gy - 44, k: p.k });
        p.timer = 1.45; p.fire = 1;
        tone(p.k === 'frost' ? 660 : 420, .07, 'triangle', .025, 1.5);
      }
    }
    if (p.k === 'puffer' && p.timer <= 0) {
      S.grid[r][c] = null;
      for (const f of S.foes) if (Math.abs(f.row - r) <= 1 && Math.abs(f.x - cx) < CW * 1.5) { f.armor = 0; f.hp -= 1800; f.hit = .1; }
      fx({ type: 'ring', x: cx, y: gy - 30, life: .5, max: .5, r: CW * 1.6, color: '#ffd447' });
      burst(cx, gy - 30, 34, ['#ffd447', '#ff9f43', '#fff3c4', '#7a4b1c'], 320, 60);
      noise(.6, .35, 700); tone(80, .5, 'sawtooth', .08, .4);
    }
  }

  // shots
  for (const s of S.shots) {
    s.x += 420 * dt;
    let best = null;
    for (const f of S.foes) if (f.row === s.row && f.hp > 0 && Math.abs(s.x - f.x) < FOES[f.k].hw && (!best || f.x < best.x)) best = f;
    if (best) {
      damage(best, 20);
      if (s.k === 'frost') best.slow = 4;
      s.dead = true;
      burst(s.x, s.y, 4, s.k === 'frost' ? ['#bff6ff', '#7fe7ff'] : ['#5b2d8a', '#c79bff'], 70, 60);
      tone(s.k === 'frost' ? 900 : 300, .05, 'square', .015);
    }
    if (s.x > W + 20) s.dead = true;
  }
  S.shots = S.shots.filter(s => !s.dead);

  // foes
  for (const f of S.foes) {
    const d = FOES[f.k];
    f.slow = Math.max(0, f.slow - dt); f.hit = Math.max(0, f.hit - dt);
    const k = f.slow > 0 ? .5 : 1;
    f.anim += dt * k;
    const front = f.x - 20, col = Math.floor((front - GX) / CW);
    const p = col >= 0 && col < COLS ? S.grid[f.row][col] : null;
    if (p && front < cellX(col) + 30) {
      f.eating = true;
      p.hp -= d.dps * k * dt; p.hit = .12;
      if (Math.random() < dt * 3) tone(rand(140, 190), .06, 'square', .02);
      if (p.hp <= 0) { S.grid[f.row][col] = null; burst(cellX(col), groundY(f.row) - 24, 14, ['#e3be82', '#ffffff', '#c9a36a'], 140); tone(160, .2, 'triangle', .05, .5); }
    } else {
      f.eating = false;
      f.x -= d.speed * k * dt;
    }
    if (f.x < GX - 12 && S.jets[f.row].st === 'ready') { S.jets[f.row].st = 'run'; noise(1.2, .15, 1500); tone(300, .8, 'sine', .05, 2.5); }
    if (f.x < 26) { lose(); return; }
  }
  for (let r = 0; r < ROWS; r++) {
    const j = S.jets[r];
    if (j.st !== 'run') continue;
    j.x += 520 * dt;
    for (const f of S.foes) if (f.row === r && f.x < j.x + 34 && f.hp > 0) { f.hp = 0; f.armor = 0; }
    if (Math.random() < .8) fx({ x: j.x - 20, y: groundY(r) - rand(10, 60), vx: -rand(20, 80), vy: -rand(10, 40), life: .7, max: .7, r: rand(2, 6), color: 'rgba(233,251,247,.8)', type: 'bubble' });
    if (j.x > W + 60) j.st = 'used';
  }
  for (const f of S.foes) if (f.hp <= 0) {
    f.dead = true; S.kills++;
    const gy = groundY(f.row);
    const cols = f.k === 'blob' ? ['#1e1530', '#7b5cff', '#2ee6c9'] : f.k === 'eel' ? ['#6f8f4e', '#ffffff', '#a9c27e'] : ['#b8c2c8', '#e04a3f', '#e2553f'];
    burst(f.x, gy - 30, 16, cols, 160);
    tone(f.k === 'blob' ? 120 : 240, .25, 'triangle', .05, .5);
  }
  S.foes = S.foes.filter(f => !f.dead);

  // pearls
  for (const p of S.pearlsF) {
    p.spin += dt * 2;
    if (p.col) {
      const a = Math.min(1, dt * 7);
      p.x += (PEARL_POS.x - p.x) * a; p.y += (PEARL_POS.y - p.y) * a;
      if (Math.hypot(p.x - PEARL_POS.x, p.y - PEARL_POS.y) < 14) { p.dead = true; S.pearls += p.v; }
    } else if (p.sky) {
      if (p.y < p.ty) p.y = Math.min(p.ty, p.y + 55 * dt); else p.life -= dt;
    } else {
      if (p.vy !== 0 || p.y < p.ty) {
        p.vy += 380 * dt; p.y += p.vy * dt; p.x += p.vx * dt;
        if (p.y >= p.ty && p.vy > 0) { p.y = p.ty; p.vy = 0; p.vx = 0; }
      } else p.life -= dt;
    }
    if (p.life <= 0) p.dead = true;
  }
  S.pearlsF = S.pearlsF.filter(p => !p.dead);

  if (!S.endless && S.wave >= TOTAL_WAVES && !S.spawnQ.length && !S.foes.length && mode === 'play') win();
}
function updateFx(dt) {
  for (const p of S.fx) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  S.fx = S.fx.filter(p => p.life > 0);
}
function lose() { mode = 'over'; S.sel = null; noise(1, .2, 300); tone(196, .9, 'sawtooth', .06, .4); }
function win() { mode = 'won'; S.sel = null; [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .3, 'triangle', .06), i * 140)); }

// ---------- drawing: world ----------
function drawWorld(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f5466'); g.addColorStop(.25, '#0b3f4f'); g.addColorStop(1, '#062633');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // light rays
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = 180 + i * 190 + Math.sin(t * .3 + i) * 30;
    const rg = ctx.createLinearGradient(0, 0, 0, H * .9);
    rg.addColorStop(0, 'rgba(160,240,230,.10)'); rg.addColorStop(1, 'rgba(160,240,230,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.moveTo(x - 30, 0); ctx.lineTo(x + 30, 0); ctx.lineTo(x + 140, H); ctx.lineTo(x + 20, H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // far kelp silhouettes
  ctx.fillStyle = '#0a3442';
  for (let i = 0; i < 14; i++) {
    const bx = 40 + i * 74, h = 60 + (i * 37 % 50);
    ctx.beginPath(); ctx.moveTo(bx - 5, GY + 4);
    for (let y = 0; y <= h; y += 10) ctx.lineTo(bx + Math.sin(t * .9 + i + y * .06) * 6 - 4, GY + 4 - y);
    for (let y = h; y >= 0; y -= 10) ctx.lineTo(bx + Math.sin(t * .9 + i + y * .06) * 6 + 4, GY + 4 - y);
    ctx.fill();
  }

  // sand board, cut-paper edge
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.roundRect(GX - 4, GY - 2, CW * COLS + 12, CH * ROWS + 10, 14); ctx.fill();
  ctx.beginPath(); ctx.roundRect(GX, GY - 6, CW * COLS, CH * ROWS + 6, 12); ctx.clip();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#d8b176' : '#e3be82';
    ctx.fillRect(GX + c * CW, GY + r * CH - (r === 0 ? 6 : 0), CW, CH + (r === 0 ? 6 : 0));
  }
  for (let r = 1; r < ROWS; r++) { ctx.fillStyle = 'rgba(120,80,30,.14)'; ctx.fillRect(GX, GY + r * CH - 1, CW * COLS, 2); }
  for (const d of decor) {
    if (d.k === 'pebble') { ctx.fillStyle = 'rgba(120,90,50,.35)'; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r * 1.4, d.r, d.a, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = 'rgba(255,240,220,.55)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 1, Math.PI, 0); ctx.fill(); }
  }
  // caustics
  if (!reduceMotion || true) {
    ctx.strokeStyle = 'rgba(255,255,240,.13)'; ctx.lineWidth = 2;
    for (let i = 0; i < 16; i++) {
      const y0 = GY + i * 32 + 8;
      ctx.beginPath();
      for (let x = GX; x <= GX + CW * COLS; x += 16) {
        const y = y0 + Math.sin(x * .03 + t * (reduceMotion ? 0 : 1.1) + i) * 6 + Math.sin(x * .011 - t * .7 + i * 2) * 4;
        x === GX ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  ctx.restore();

  // grotto
  ctx.fillStyle = '#0e3a46';
  ctx.beginPath(); ctx.moveTo(0, GY - 20);
  ctx.bezierCurveTo(60, GY - 50, 120, GY - 10, GX - 10, GY + 10);
  ctx.lineTo(GX - 6, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#134b59';
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.ellipse(30 + (i % 2) * 60, GY + 40 + i * 70, 46, 30, i, 0, 7); ctx.fill(); }
  // seagrass
  ctx.strokeStyle = '#2f8f6a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const bx = 14 + i * 16, by = H - 4;
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + Math.sin(t * 1.4 + i) * 10, by - 40, bx + Math.sin(t * 1.4 + i + 1) * 14, by - 70 - (i % 3) * 18);
    ctx.stroke();
  }
  // jets
  for (let r = 0; r < ROWS; r++) {
    const j = S.jets[r];
    if (j.st === 'used') continue;
    drawConch(j.x, groundY(r) - 18, t, j.st === 'run');
  }
}
function drawConch(x, y, t, running) {
  ctx.save(); ctx.translate(x, y);
  if (running) {
    ctx.strokeStyle = 'rgba(233,251,247,.6)'; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-30 - i * 22, 0, 10 + i * 5, 0, Math.PI * 1.4); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 18, 22, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f7d6c4';
  ctx.beginPath(); ctx.moveTo(-22, 4); ctx.quadraticCurveTo(-18, -18, 6, -16); ctx.quadraticCurveTo(26, -10, 26, 6); ctx.quadraticCurveTo(10, 18, -22, 4); ctx.fill();
  ctx.fillStyle = '#ff9a8a'; ctx.beginPath(); ctx.ellipse(18, 0, 7, 10, -.3, 0, 7); ctx.fill();
  ctx.strokeStyle = '#d9a48e'; ctx.lineWidth = 2;

    const fxp = mx + mw * fw / TOTAL_WAVES - 6;
    ctx.fillStyle = S.wave >= fw ? '#ffd447' : '#e9fbf7';
    ctx.beginPath(); ctx.moveTo(fxp, my - 4); ctx.lineTo(fxp, my + 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fxp, my - 4); ctx.lineTo(fxp + 10, my + 1); ctx.lineTo(fxp, my + 6); ctx.fill();
  }

  // buttons
  btn(PAUSE, paused ? 'play' : 'pause'); btn(MUTE, muted ? 'muted' : 'sound');
}
function drawShovel(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(-.6);
  ctx.fillStyle = '#9c7a52'; ctx.beginPath(); ctx.roundRect(-3, -26, 6, 34, 3); ctx.fill();
  ctx.fillStyle = '#c9d3d8'; ctx.beginPath(); ctx.moveTo(-11, 6); ctx.lineTo(11, 6); ctx.quadraticCurveTo(12, 24, 0, 28); ctx.quadraticCurveTo(-12, 24, -11, 6); ctx.fill();
  ctx.restore();
}
function btn(r, icon) {
  ctx.fillStyle = '#0b2f3b'; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(233,251,247,.18)'; ctx.lineWidth = 2; ctx.stroke();
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.fillStyle = '#e9fbf7'; ctx.strokeStyle = '#e9fbf7';
  if (icon === 'pause') { ctx.fillRect(cx - 7, cy - 8, 5, 16); ctx.fillRect(cx + 2, cy - 8, 5, 16); }
  else if (icon === 'play') { ctx.beginPath(); ctx.moveTo(cx - 6, cy - 9); ctx.lineTo(cx + 9, cy); ctx.lineTo(cx - 6, cy + 9); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.moveTo(cx - 10, cy - 4); ctx.lineTo(cx - 5, cy - 4); ctx.lineTo(cx + 1, cy - 9); ctx.lineTo(cx + 1, cy + 9); ctx.lineTo(cx - 5, cy + 4); ctx.lineTo(cx - 10, cy + 4); ctx.fill();
    ctx.lineWidth = 2;
    if (icon === 'sound') { ctx.beginPath(); ctx.arc(cx + 2, cy, 7, -.8, .8); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(cx + 5, cy - 5); ctx.lineTo(cx + 11, cy + 5); ctx.moveTo(cx + 11, cy - 5); ctx.lineTo(cx + 5, cy + 5); ctx.stroke(); }
  }
}

function overlay(title, sub, buttons, t) {
  ctx.fillStyle = 'rgba(3,22,30,.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '78px "Lilita One", sans-serif';
  ctx.fillStyle = '#062633'; ctx.fillText(title, W / 2 + 4, 214 + 5);
  ctx.fillStyle = '#ffd9a0'; ctx.fillText(title, W / 2, 214);
  ctx.fillStyle = '#e9fbf7'; ctx.font = '800 20px Nunito, sans-serif'; ctx.globalAlpha = .9;
  sub.forEach((line, i) => ctx.fillText(line, W / 2, 278 + i * 30));
  ctx.globalAlpha = 1;
  buttons.forEach(b => {
    const hov = S.hover && inR(S.hover, b);
    ctx.fillStyle = b.primary ? (hov ? '#ff9184' : '#ff7a6b') : (hov ? '#1a6b7c' : '#0f4c5c');
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 28); ctx.fill();
    ctx.fillStyle = b.primary ? '#3a0f0a' : '#e9fbf7'; ctx.font = '26px "Lilita One", sans-serif';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  });
}
const BTN_START = { x: W / 2 - 120, y: 420, w: 240, h: 60, label: 'Defend the reef', primary: true };
const BTN_RETRY = { x: W / 2 - 120, y: 420, w: 240, h: 60, label: 'Try again', primary: true };
const BTN_ENDLESS = { x: W / 2 - 260, y: 420, w: 250, h: 60, label: 'Keep defending', primary: true };
const BTN_RESTART = { x: W / 2 + 10, y: 420, w: 250, h: 60, label: 'New game' };

// ---------- render ----------
function render() {
  const t = S.t;
  drawWorld(t);

  // plants
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = S.grid[r][c]; if (!p) continue;
    ctx.save(); ctx.translate(cellX(c) + (p.hit > 0 ? rand(-1, 1) : 0), groundY(r) - 32);
    const pop = Math.min(1, (S.t - p.born) * 6);
    ctx.scale(.6 + .4 * pop, .6 + .4 * pop);
    PLANT_DRAW[p.k](t + c * .7 + r, p);
    ctx.restore();
    if (mode === 'play' && S.sel === 'shovel' && S.hover && hoverCell()?.r === r && hoverCell()?.c === c) {
      ctx.fillStyle = 'rgba(255,90,70,.25)'; ctx.fillRect(GX + c * CW, GY + r * CH, CW, CH);
    }
  }

  // placement ghost
  const hc = mode === 'play' && S.sel && S.sel !== 'shovel' ? hoverCell() : null;
  if (hc && !S.grid[hc.r][hc.c]) {
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(GX + hc.c * CW, GY + hc.r * CH, CW, CH);
    ctx.save(); ctx.globalAlpha = .5; ctx.translate(cellX(hc.c), groundY(hc.r) - 32); PLANT_DRAW[S.sel](t, null); ctx.restore();
  }

  // foes, back rows first
  [...S.foes].sort((a, b) => a.row - b.row || b.x - a.x).forEach(drawFoe);

  // shots
  for (const s of S.shots) {
    if (s.k === 'frost') {
      ctx.fillStyle = 'rgba(127,231,255,.85)'; ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x - 3, s.y - 3, 2.5, 0, 7); ctx.fill();
    } else {
      ctx.strokeStyle = '#2a1446'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x - 16, s.y); ctx.lineTo(s.x + 4, s.y); ctx.stroke();
      ctx.fillStyle = '#c79bff'; ctx.beginPath(); ctx.moveTo(s.x + 4, s.y - 3); ctx.lineTo(s.x + 11, s.y); ctx.lineTo(s.x + 4, s.y + 3); ctx.fill();
    }
  }

  // fx
  for (const p of S.fx) {
    const a = Math.max(0, p.life / p.max);
    if (p.type === 'ring') {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = 8 * a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - a * .8), 0, 7); ctx.stroke();
    } else if (p.type === 'bubble') {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle = p.color; ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ambient bubbles
  ctx.strokeStyle = 'rgba(233,251,247,.22)'; ctx.lineWidth = 1.2;
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); }

  // pearls
  for (const p of S.pearlsF) {
    if (!p.col && p.life < 2.2 && Math.floor(p.life * 8) % 2) continue;
    ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = '#fff3fb';
    ctx.beginPath(); ctx.arc(p.x, p.y, 20 + Math.sin(p.spin * 2) * 2, 0, 7); ctx.fill(); ctx.restore();
    pearl(p.x, p.y, 13);
  }

  drawHUD(t);

  // shovel cursor / banner
  if (mode === 'play' && S.sel === 'shovel' && S.hover && S.hover.y > GY) drawShovel(S.hover.x + 10, S.hover.y - 14, .9);
  if (S.banner && mode === 'play') {
    const a = Math.min(1, S.banner.t * 2, (2.6 - S.banner.t) * 4);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '54px "Lilita One", sans-serif';
    ctx.fillStyle = '#062633'; ctx.fillText(S.banner.text, W / 2 + 3, 330 + 4);
    ctx.fillStyle = S.banner.sub ? '#ff9a8a' : '#ffd9a0'; ctx.fillText(S.banner.text, W / 2, 330);
    ctx.globalAlpha = 1;
  }

  if (mode === 'title') overlay('TIDEWALL', ['Trash is drifting in on the tide. Plant reef creatures to hold the line.', 'Clams make pearls · urchins shoot spines · anemones freeze · puffers burst'], [BTN_START], t);
  else if (mode === 'over') overlay('Reef overrun', [`The tide reached the grotto on tide ${S.wave}.`, `You cleared ${S.kills} pieces of trash.`], [BTN_RETRY], t);
  else if (mode === 'won') overlay('Reef saved!', [`All ${TOTAL_WAVES} tides held back. ${S.kills} pieces of trash cleared.`, 'Stay on and see how long the reef can last.'], [BTN_ENDLESS, BTN_RESTART], t);
  else if (paused) {
    ctx.fillStyle = 'rgba(3,22,30,.55)'; ctx.fillRect(0, 108, W, H - 108);
    ctx.fillStyle = '#ffd9a0'; ctx.textAlign = 'center'; ctx.font = '60px "Lilita One", sans-serif'; ctx.fillText('Paused', W / 2, 350);
  }
}

// ---------- input ----------
function local(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function hoverCell() {
  const h = S.hover; if (!h) return null;
  const c = Math.floor((h.x - GX) / CW), r = Math.floor((h.y - GY) / CH);
  return c >= 0 && c < COLS && r >= 0 && r < ROWS ? { r, c } : null;
}
function selectCard(k) {
  if (mode !== 'play' || paused) return;
  if (k === 'shovel') { S.sel = S.sel === 'shovel' ? null : 'shovel'; return; }
  if (S.sel === k) { S.sel = null; return; }
  if (S.cards[k] > 0 || S.pearls < PLANTS[k].cost) { tone(150, .1, 'square', .03); return; }
  S.sel = k; tone(520, .06, 'triangle', .03);
}
function startGame() { newGame(); mode = 'play'; paused = false; banner('Get ready', null); S.banner.sub = null; }
cv.addEventListener('pointermove', e => { S.hover = local(e); });
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', e => {
  audio(); cv.focus({ preventScroll: true });
  const p = local(e); S.hover = p;
  if (mode === 'title') { if (inR(p, BTN_START)) startGame(); return; }
  if (mode === 'over') { if (inR(p, BTN_RETRY)) startGame(); return; }
  if (mode === 'won') {
    if (inR(p, BTN_ENDLESS)) { mode = 'play'; S.endless = true; S.waveT = S.waveLen = 8; }
    else if (inR(p, BTN_RESTART)) startGame();
    return;
  }
  if (inR(p, MUTE)) { muted = !muted; return; }
  if (inR(p, PAUSE)) { paused = !paused; return; }
  if (paused) return;
  for (const pr of S.pearlsF) if (!pr.col && Math.hypot(pr.x - p.x, pr.y - p.y) < 30) { pr.col = true; tone(1046, .12, 'sine', .05, 1.5); return; }
  for (let i = 0; i < ORDER.length; i++) if (inR(p, CARD(i))) { selectCard(ORDER[i]); return; }
  if (inR(p, SHOVEL)) { selectCard('shovel'); return; }
  const hc = hoverCell();
  if (hc && S.sel) {
    const cur = S.grid[hc.r][hc.c];
    if (S.sel === 'shovel') {
      if (cur) { S.grid[hc.r][hc.c] = null; burst(cellX(hc.c), groundY(hc.r) - 20, 10, ['#e3be82', '#fff'], 100); tone(260, .12, 'triangle', .04, .6); }
      S.sel = null; return;
    }
    const def = PLANTS[S.sel];
    if (!cur && S.pearls >= def.cost && S.cards[S.sel] <= 0) {
      S.grid[hc.r][hc.c] = { k: S.sel, hp: def.hp, timer: S.sel === 'clam' ? 6 : S.sel === 'puffer' ? 1.1 : 0, hit: 0, fire: 0, born: S.t };
      S.pearls -= def.cost; S.cards[S.sel] = def.cd; S.sel = null;
      burst(cellX(hc.c), groundY(hc.r), 8, ['#e3be82', '#fff'], 80);
      tone(330, .1, 'triangle', .05, 1.6);
    }
    return;
  }
  S.sel = null;
});
cv.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '5') selectCard(ORDER[+k - 1]);
  else if (k === 's') selectCard('shovel');
  else if (k === 'p' && mode === 'play') paused = !paused;
  else if (k === 'escape') S.sel = null;
  else if ((k === 'enter' || k === ' ') && mode !== 'play') { audio(); mode === 'won' ? (mode = 'play', S.endless = true, S.waveT = S.waveLen = 8) : startGame(); }
  else return;
  e.preventDefault();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') paused = true; });

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
cv.focus({ preventScroll: true });
document.fonts && document.fonts.ready.then(render);
requestAnimationFrame(frame);
})();
</script>
