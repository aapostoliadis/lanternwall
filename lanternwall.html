<style>
/* Layout: one fixed-ratio canvas stage, scaled to fit, with a one-line control hint under it. Single lantern-night look. */
:root {
  --night: #14123a;
  --dusk: #241f5e;
  --deepnight: #0d0b2a;
  --lantern: #ff9d4d;
  --glow: #ffd58a;
  --paper: #ffe6b8;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 0%, var(--dusk), var(--deepnight) 70%);
  background-color: var(--night);
  color: var(--paper);
  font-family: var(--body);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow: hidden;
}
#wrap { flex: 1; min-height: 0; width: 100%; max-width: 1240px; display: flex; align-items: center; justify-content: center; }
canvas { display: block; border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(255,190,110,.12); touch-action: manipulation; cursor: pointer; }
canvas:focus-visible { outline: 3px solid var(--lantern); outline-offset: 4px; }
.hint { font-size: 13px; letter-spacing: .02em; opacity: .72; text-align: center; text-wrap: balance; max-width: 70ch; }
.hint b { font-weight: 800; color: var(--glow); }
/* On a phone held upright the board is too small to tap comfortably, so suggest turning it sideways. */
.rotate { display: none; font-weight: 800; color: var(--glow); }
@media (orientation: portrait) and (pointer: coarse) { .rotate { display: block; } }
/* Touch screens have no keys to list, and a short landscape phone needs that height for the board. */
@media (pointer: coarse) and (max-height: 500px) { .keys { display: none; } }
</style>

<p class="hint rotate">Turn your phone sideways for a bigger garden.</p>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Lanternwall game board"></canvas></div>
<p class="hint keys">Pick a lantern card, then a tile. Tap fireflies to catch them. Keys: <b>1–5</b> lanterns, <b>S</b> shovel, <b>P</b> pause, <b>F</b> 2× speed, <b>M</b> mute, <b>Esc</b> cancel.</p>

<script>
(() => {
const W = 1000, H = 620;
const GX = 170, GY = 118, CW = 88, CH = 96, COLS = 9, ROWS = 5;
const PEARL_POS = { x: 58, y: 46 };
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const r = document.getElementById('wrap').getBoundingClientRect();
  const s = Math.max(0.2, Math.min(r.width / W, r.height / H));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr * cv.width / Math.round(W * s * dpr), 0, 0, s * dpr * cv.height / Math.round(H * s * dpr), 0, 0);
}
addEventListener('resize', resize);

// ---------- definitions ----------
const PLANTS = {
  clam:   { name: 'Firefly Lantern', cost: 50,  cd: 7.5, hp: 300 },
  urchin: { name: 'Ember Lantern',   cost: 100, cd: 7.5, hp: 300 },
  frost:  { name: 'Frost Lantern',   cost: 175, cd: 7.5, hp: 300 },
  coral:  { name: 'Stone Lantern',   cost: 50,  cd: 30,  hp: 4000 },
  puffer: { name: 'Firecracker',     cost: 150, cd: 35,  hp: 9999 },
};
const ORDER = ['clam', 'urchin', 'frost', 'coral', 'puffer'];
const FOES = {
  wisp:   { hp: 200,  armor: 0,    speed: 17, dps: 100, cost: 1, from: 1, w: 3,   hw: 24 },
  runner: { hp: 300,  armor: 0,    speed: 34, dps: 80,  cost: 2, from: 3, w: 2,   hw: 26 },
  masked: { hp: 200,  armor: 1000, speed: 17, dps: 100, cost: 3, from: 4, w: 1.5, hw: 24 },
  hulk:   { hp: 1500, armor: 0,    speed: 9,  dps: 220, cost: 5, from: 7, w: 1,   hw: 36 },
};
const TOTAL_WAVES = 10;
const cellX = c => GX + c * CW + CW / 2;
const groundY = r => GY + r * CH + CH / 2 + 28;
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- state ----------
let mode = 'title', paused = false, S;
function newGame() {
  S = {
    t: 0, pearls: 150,
    grid: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
    foes: [], shots: [], pearlsF: [], fx: [],
    jets: Array.from({ length: ROWS }, () => ({ st: 'ready', x: GX - 36 })),
    cards: Object.fromEntries(ORDER.map(k => [k, 0])),
    sel: null, hover: null,
    wave: 0, waveT: 22, waveLen: 22, endless: false,
    nextSky: 5, spawnQ: [], kills: 0, banner: null,
  };
}
newGame();
const decor = Array.from({ length: 34 }, () => ({
  x: rand(GX + 6, GX + CW * COLS - 6), y: rand(GY + 10, GY + CH * ROWS - 6),
  k: Math.random() < .5 ? 'pebble' : 'shell', r: rand(2, 5), a: rand(0, 6),
}));
const bubbles = Array.from({ length: 26 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(1.5, 4.5), s: rand(10, 28), p: rand(0, 6) }));

// ---------- audio ----------
// mute survives reloads; storage can be blocked, so failures are ignored
let AC = null, muted = false;
try { muted = localStorage.getItem('lanternwall.muted') === '1'; } catch (e) {}
function toggleMute() { muted = !muted; try { localStorage.setItem('lanternwall.muted', muted ? '1' : '0'); } catch (e) {} }
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = .07, slide = 0) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), n + d);
  g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  o.connect(g).connect(AC.destination); o.start(n); o.stop(n + d + .02);
}
function noise(d, v = .2, freq = 900) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, len, AC.sampleRate), data = b.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
  src.buffer = b; src.connect(f).connect(g).connect(AC.destination); src.start();
}

// ---------- helpers ----------
function fx(o) { S.fx.push(Object.assign({ vx: 0, vy: 0, life: .6, max: .6, r: 3, color: '#fff', type: 'dot', g: 0 }, o)); }
function burst(x, y, n, colors, spd = 120, g = 120) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * .3, spd);
    fx({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rand(.4, .9), r: rand(2, 5), color: colors[i % colors.length], g });
  }
}
function banner(text, sub) { S.banner = { text, sub, t: 2.6 }; }
function damage(f, amt) {
  if (f.armor > 0) {
    f.armor -= amt;
    if (f.armor <= 0) { f.hp += f.armor; f.armor = 0; burst(f.x, groundY(f.row) - 56, 10, ['#6d6688', '#ffb347'], 160); tone(220, .15, 'square', .04, .5); }
  } else f.hp -= amt;
  f.hit = .1;
}

// ---------- waves ----------
const INTRO = { runner: 'New shadow: runners are fast but frail', masked: 'New shadow: masks soak up sparks until they crack', hulk: 'New shadow: hulks are slow, huge and hungry' };
function startWave() {
  S.wave++;
  const n = S.wave, flag = n % 5 === 0;
  let budget = Math.round(1 + n * 1.5 + (flag ? n * 1.2 : 0));
  const pool = Object.entries(FOES).filter(([, f]) => f.from <= n);
  let delay = 0;
  while (budget > 0) {
    const opts = pool.filter(([, f]) => f.cost <= budget);
    if (!opts.length) break;
    let tot = opts.reduce((s, [, f]) => s + f.w, 0), pick = Math.random() * tot, k = opts[0][0];
    for (const [key, f] of opts) { pick -= f.w; if (pick <= 0) { k = key; break; } }
    budget -= FOES[k].cost;
    S.spawnQ.push({ k, t: delay });
    delay += flag ? rand(.5, 1.2) : rand(1.2, 3.2);
  }
  if (flag) { banner('A long dark is falling!', 'Night ' + n); noise(.8, .12, 400); tone(110, .8, 'sawtooth', .05, .6); }
  else {
    const fresh = Object.keys(FOES).find(k => FOES[k].from === n && INTRO[k]);
    banner('Night ' + n, fresh ? INTRO[fresh] : null);
    if (fresh) tone(150, .5, 'sawtooth', .04, .7);
  }
  S.waveLen = S.waveT = flag ? 32 : 24;
}
function spawnFoe(k) {
  const d = FOES[k];
  S.foes.push({ k, row: Math.floor(Math.random() * ROWS), x: W + rand(30, 60), hp: d.hp, armor: d.armor, slow: 0, hit: 0, anim: rand(0, 10), eating: false });
}

// ---------- update ----------
function update(dt) {
  for (const b of bubbles) { b.y -= b.s * dt; b.x += Math.sin(S.t * .8 + b.p) * 6 * dt; if (b.y < -10) { b.y = H + 10; b.x = rand(0, W); } }
  updateFx(dt);
  if (mode !== 'play' || paused) { if (mode === 'title') S.t += dt; return; }
  S.t += dt;
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
  for (const k of ORDER) S.cards[k] = Math.max(0, S.cards[k] - dt);

  // sky pearls
  S.nextSky -= dt;
  if (S.nextSky <= 0) {
    S.pearlsF.push({ x: rand(GX + 20, GX + CW * COLS - 20), y: -20, ty: rand(GY + 50, H - 50), v: 25, sky: true, vy: 0, life: 9, col: false, spin: rand(0, 6) });
    S.nextSky = rand(8, 11);
  }

  // waves
  const more = S.endless || S.wave < TOTAL_WAVES;
  if (more) {
    if (S.wave > 0 && !S.foes.length && !S.spawnQ.length && S.waveT > 5) S.waveT = 5;
    S.waveT -= dt;
    if (S.waveT <= 0) startWave();
  }
  for (const q of S.spawnQ) q.t -= dt;
  for (const q of S.spawnQ.filter(q => q.t <= 0)) spawnFoe(q.k);
  S.spawnQ = S.spawnQ.filter(q => q.t > 0);

  // plants
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = S.grid[r][c]; if (!p) continue;
    p.hit = Math.max(0, p.hit - dt); p.fire = Math.max(0, p.fire - dt * 4);
    p.timer -= dt;
    const cx = cellX(c), gy = groundY(r);
    if (p.k === 'clam' && p.timer <= 0) {
      S.pearlsF.push({ x: cx + rand(-14, 14), y: gy - 40, ty: gy - rand(4, 16), v: 25, sky: false, vy: -150, vx: rand(-30, 30), life: 9, col: false, spin: rand(0, 6) });
      p.timer = rand(10, 12);
      tone(880, .12, 'sine', .03, 1.4);
    }
    if ((p.k === 'urchin' || p.k === 'frost') && p.timer <= 0) {
      if (S.foes.some(f => f.row === r && f.x > cx - 10 && f.x < W - 8)) {
        S.shots.push({ row: r, x: cx + 22, y: gy - 44, k: p.k });
        p.timer = 1.45; p.fire = 1;
        tone(p.k === 'frost' ? 660 : 420, .07, 'triangle', .025, 1.5);
      }
    }
    if (p.k === 'puffer' && p.timer <= 0) {
      S.grid[r][c] = null;
      for (const f of S.foes) if (Math.abs(f.row - r) <= 1 && Math.abs(f.x - cx) < CW * 1.5) { f.armor = 0; f.hp -= 1800; f.hit = .1; }
      fx({ type: 'ring', x: cx, y: gy - 30, life: .5, max: .5, r: CW * 1.6, color: '#ffb347' });
      burst(cx, gy - 30, 34, ['#ffcf5a', '#ff4f7b', '#fff1c4', '#ff9d4d'], 320, 60);
      noise(.6, .35, 700); tone(80, .5, 'sawtooth', .08, .4);
    }
  }

  // shots
  for (const s of S.shots) {
    s.x += 420 * dt;
    let best = null;
    for (const f of S.foes) if (f.row === s.row && f.hp > 0 && Math.abs(s.x - f.x) < FOES[f.k].hw && (!best || f.x < best.x)) best = f;
    if (best) {
      damage(best, 20);
      if (s.k === 'frost') best.slow = 4;
      s.dead = true;
      burst(s.x, s.y, 4, s.k === 'frost' ? ['#e2f2ff', '#8cc8ff'] : ['#fff3b0', '#ffcf6a'], 70, 60);
      tone(s.k === 'frost' ? 900 : 300, .05, 'square', .015);
    }
    if (s.x > W + 20) s.dead = true;
  }
  S.shots = S.shots.filter(s => !s.dead);

  // foes
  for (const f of S.foes) {
    const d = FOES[f.k];
    f.slow = Math.max(0, f.slow - dt); f.hit = Math.max(0, f.hit - dt);
    const k = f.slow > 0 ? .5 : 1;
    f.anim += dt * k;
    const front = f.x - 20, col = Math.floor((front - GX) / CW);
    const p = col >= 0 && col < COLS ? S.grid[f.row][col] : null;
    if (p && front < cellX(col) + 30) {
      f.eating = true;
      p.hp -= d.dps * k * dt; p.hit = .12;
      if (Math.random() < dt * 3) tone(rand(140, 190), .06, 'square', .02);
      if (p.hp <= 0) { S.grid[f.row][col] = null; burst(cellX(col), groundY(f.row) - 24, 14, ['#ff9d4d', '#fff1c4', '#3a1d10'], 140); tone(160, .2, 'triangle', .05, .5); }
    } else {
      f.eating = false;
      f.x -= d.speed * k * dt;
    }
    if (f.x < GX - 12 && S.jets[f.row].st === 'ready') { S.jets[f.row].st = 'run'; noise(1.2, .15, 1500); tone(300, .8, 'sine', .05, 2.5); }
    if (f.x < 26) { lose(); return; }
  }
  for (let r = 0; r < ROWS; r++) {
    const j = S.jets[r];
    if (j.st !== 'run') continue;
    j.x += 520 * dt;
    for (const f of S.foes) if (f.row === r && f.x < j.x + 34 && f.hp > 0) { f.hp = 0; f.armor = 0; }
    if (Math.random() < .8) fx({ x: j.x - 20, y: groundY(r) - rand(10, 60), vx: -rand(20, 80), vy: -rand(10, 40), life: .7, max: .7, r: rand(2, 6), color: 'rgba(255,200,120,.8)', type: 'bubble' });
    if (j.x > W + 60) j.st = 'used';
  }
  for (const f of S.foes) if (f.hp <= 0) {
    f.dead = true; S.kills++;
    const gy = groundY(f.row);
    const cols = f.k === 'hulk' ? ['#07061a', '#ff3c3c', '#2a2566'] : f.k === 'runner' ? ['#07061a', '#ffb347', '#1d1950'] : ['#07061a', '#ff3c3c', '#3a2f78'];
    burst(f.x, gy - 30, 16, cols, 160);
    tone(f.k === 'hulk' ? 120 : 240, .25, 'triangle', .05, .5);
  }
  S.foes = S.foes.filter(f => !f.dead);

  // pearls
  for (const p of S.pearlsF) {
    p.spin += dt * 2;
    if (p.col) {
      const a = Math.min(1, dt * 7);
      p.x += (PEARL_POS.x - p.x) * a; p.y += (PEARL_POS.y - p.y) * a;
      if (Math.hypot(p.x - PEARL_POS.x, p.y - PEARL_POS.y) < 14) { p.dead = true; S.pearls += p.v; }
    } else if (p.sky) {
      if (p.y < p.ty) p.y = Math.min(p.ty, p.y + 55 * dt); else p.life -= dt;
    } else {
      if (p.vy !== 0 || p.y < p.ty) {
        p.vy += 380 * dt; p.y += p.vy * dt; p.x += p.vx * dt;
        if (p.y >= p.ty && p.vy > 0) { p.y = p.ty; p.vy = 0; p.vx = 0; }
      } else p.life -= dt;
    }
    if (p.life <= 0) p.dead = true;
  }
  S.pearlsF = S.pearlsF.filter(p => !p.dead);

  if (!S.endless && S.wave >= TOTAL_WAVES && !S.spawnQ.length && !S.foes.length && mode === 'play') win();
}
function updateFx(dt) {
  for (const p of S.fx) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  S.fx = S.fx.filter(p => p.life > 0);
}
// best night reached survives reloads; storage can be blocked (private windows), so failures are ignored
// endless runs keep their own record, so a long endless night never hides the campaign best
let best = 0, bestEndless = 0, newBest = false;
try { best = +localStorage.getItem('lanternwall.best') || 0; bestEndless = +localStorage.getItem('lanternwall.bestEndless') || 0; } catch (e) {}
function saveBest(n) {
  if (S.endless) {
    newBest = n > bestEndless;
    if (newBest) { bestEndless = n; try { localStorage.setItem('lanternwall.bestEndless', bestEndless); } catch (e) {} }
  } else {
    newBest = n > best;
    if (newBest) { best = n; try { localStorage.setItem('lanternwall.best', best); } catch (e) {} }
  }
}
function lose() { mode = 'over'; S.sel = null; saveBest(S.wave); noise(1, .2, 300); tone(196, .9, 'sawtooth', .06, .4); }
function win() { mode = 'won'; S.sel = null; saveBest(TOTAL_WAVES); [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .3, 'triangle', .06), i * 140)); }

// ---------- drawing: world ----------
function glow(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
const stars = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(.6, 1.8), a: rand(.2, .7), p: rand(0, 6) }));
function drawWorld(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0b2a'); g.addColorStop(.35, '#14123a'); g.addColorStop(1, '#1b1846');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // stars
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,240,200,${s.a * (reduceMotion ? 1 : .7 + .3 * Math.sin(t * 1.5 + s.p))})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }

  // far bamboo silhouettes
  ctx.fillStyle = '#110f33';
  for (let i = 0; i < 14; i++) {
    const bx = 40 + i * 74, h = 60 + (i * 37 % 50);
    ctx.beginPath(); ctx.moveTo(bx - 4, GY + 4);
    for (let y = 0; y <= h; y += 10) ctx.lineTo(bx + Math.sin(t * .5 + i + y * .03) * 3 - 3, GY + 4 - y);
    for (let y = h; y >= 0; y -= 10) ctx.lineTo(bx + Math.sin(t * .5 + i + y * .03) * 3 + 3, GY + 4 - y);
    ctx.fill();
  }

  // night board
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.roundRect(GX - 4, GY - 2, CW * COLS + 12, CH * ROWS + 10, 14); ctx.fill();
  ctx.beginPath(); ctx.roundRect(GX, GY - 6, CW * COLS, CH * ROWS + 6, 12); ctx.clip();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#1f1c52' : '#24215c';
    ctx.fillRect(GX + c * CW, GY + r * CH - (r === 0 ? 6 : 0), CW, CH + (r === 0 ? 6 : 0));
  }

  ctx.fillText(S.pearls, 68, 82);

  ORDER.forEach((k, i) => {
    const r = CARD(i), def = PLANTS[k], cdLeft = S.cards[k], afford = S.pearls >= def.cost, sel = S.sel === k;
    const y = r.y - (sel ? 4 : 0);
    ctx.fillStyle = sel ? '#3a2f78' : '#2a2566'; ctx.beginPath(); ctx.roundRect(r.x, y, r.w, r.h, 12); ctx.fill();
    ctx.strokeStyle = sel ? '#ffb347' : 'rgba(255,190,110,.2)'; ctx.lineWidth = sel ? 3 : 2; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.roundRect(r.x, y, r.w, r.h, 12); ctx.clip();
    ctx.translate(r.x + r.w / 2, y + 36); ctx.scale(.62, .62); ctx.translate(0, -8);
    PLANT_DRAW[k](t, null);
    ctx.restore();
    ctx.fillStyle = '#120f36'; ctx.beginPath(); ctx.roundRect(r.x + 6, y + r.h - 24, r.w - 12, 18, 9); ctx.fill();
    pearl(r.x + 18, y + r.h - 15, 6);
    ctx.fillStyle = afford ? '#ffe6b8' : '#ff7a6a'; ctx.font = '15px "Lilita One", sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(def.cost, r.x + 28, y + r.h - 14);
    ctx.fillStyle = '#ffe6b8'; ctx.textAlign = 'right'; ctx.globalAlpha = .45; ctx.font = '11px Nunito, sans-serif'; ctx.fillText(i + 1, r.x + r.w - 7, y + 11); ctx.globalAlpha = 1;
    if (cdLeft > 0 || !afford) {
      ctx.save(); ctx.beginPath(); ctx.roundRect(r.x, y, r.w, r.h, 12); ctx.clip();
      ctx.fillStyle = 'rgba(8,6,28,.6)'; ctx.fillRect(r.x, y, r.w, r.h);
      if (cdLeft > 0) { ctx.fillStyle = 'rgba(8,6,28,.6)'; ctx.fillRect(r.x, y, r.w, r.h * (cdLeft / def.cd)); }
      ctx.restore();
    }
  });

  // shovel (a driftwood scoop)
  const sel = S.sel === 'shovel', sy = SHOVEL.y - (sel ? 4 : 0);
  ctx.fillStyle = sel ? '#3a2f78' : '#211d55'; ctx.beginPath(); ctx.roundRect(SHOVEL.x, sy, SHOVEL.w, SHOVEL.h, 12); ctx.fill();
  ctx.strokeStyle = sel ? '#ffb347' : 'rgba(255,190,110,.2)'; ctx.lineWidth = sel ? 3 : 2; ctx.stroke();
  drawShovel(SHOVEL.x + SHOVEL.w / 2, sy + 40, 1);
  ctx.fillStyle = '#ffe6b8'; ctx.globalAlpha = .6; ctx.font = '11px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('S', SHOVEL.x + SHOVEL.w / 2, sy + SHOVEL.h - 12); ctx.globalAlpha = 1;

  // tide meter
  const mx = 630, mw = 200, my = 44;
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffbf7a'; ctx.font = '17px "Lilita One", sans-serif';
  const label = S.endless ? `Night ${S.wave} · endless` : S.wave === 0 ? 'Quiet dusk' : `Night ${Math.min(S.wave, TOTAL_WAVES)} / ${TOTAL_WAVES}`;
  ctx.fillText(label, mx, my - 14);
  ctx.textAlign = 'right'; ctx.globalAlpha = .7; ctx.font = '13px Nunito, sans-serif'; ctx.fillText(`${S.kills} banished`, mx + mw, my - 14); ctx.globalAlpha = 1;
  ctx.fillStyle = '#120f36'; ctx.beginPath(); ctx.roundRect(mx, my, mw, 16, 8); ctx.fill();
  let prog = S.endless ? 1 : Math.min(1, (S.wave + (S.wave < TOTAL_WAVES ? 1 - S.waveT / S.waveLen : 0) - (S.wave < TOTAL_WAVES ? 1 : 0)) / TOTAL_WAVES);
  prog = Math.max(0, prog);
  const pg = ctx.createLinearGradient(mx, 0, mx + mw, 0);
  pg.addColorStop(0, '#ffbf7a'); pg.addColorStop(1, '#ff4f5e');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.roundRect(mx, my, Math.max(16, mw * prog), 16, 8); ctx.fill();
  for (const fw of [5, 10]) {
    const fxp = mx + mw * fw / TOTAL_WAVES - 6;
    ctx.fillStyle = S.wave >= fw ? '#ffb347' : '#ffe6b8';
    ctx.beginPath(); ctx.moveTo(fxp, my - 4); ctx.lineTo(fxp, my + 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fxp, my - 4); ctx.lineTo(fxp + 10, my + 1); ctx.lineTo(fxp, my + 6); ctx.fill();
  }

  // buttons
  btn(FAST, fast ? 'fast' : 'slow'); btn(PAUSE, paused ? 'play' : 'pause'); btn(MUTE, muted ? 'muted' : 'sound');
}
function drawShovel(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(-.6);
  ctx.fillStyle = '#8a6a3c'; ctx.beginPath(); ctx.roundRect(-3, -26, 6, 34, 3); ctx.fill();
  ctx.fillStyle = '#6d6688'; ctx.beginPath(); ctx.moveTo(-11, 6); ctx.lineTo(11, 6); ctx.quadraticCurveTo(12, 24, 0, 28); ctx.quadraticCurveTo(-12, 24, -11, 6); ctx.fill();
  ctx.restore();
}
function btn(r, icon) {
  ctx.fillStyle = '#211d55'; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,190,110,.2)'; ctx.lineWidth = 2; ctx.stroke();
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.fillStyle = '#ffe6b8'; ctx.strokeStyle = '#ffe6b8';
  if (icon === 'pause') { ctx.fillRect(cx - 7, cy - 8, 5, 16); ctx.fillRect(cx + 2, cy - 8, 5, 16); }
  else if (icon === 'fast' || icon === 'slow') {
    if (icon === 'fast') { ctx.fillStyle = '#ffb347'; ctx.strokeStyle = '#ffb347'; }
    for (const dx of [-9, 0]) { ctx.beginPath(); ctx.moveTo(cx + dx, cy - 8); ctx.lineTo(cx + dx + 9, cy); ctx.lineTo(cx + dx, cy + 8); ctx.fill(); }
  }
  else if (icon === 'play') { ctx.beginPath(); ctx.moveTo(cx - 6, cy - 9); ctx.lineTo(cx + 9, cy); ctx.lineTo(cx - 6, cy + 9); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.moveTo(cx - 10, cy - 4); ctx.lineTo(cx - 5, cy - 4); ctx.lineTo(cx + 1, cy - 9); ctx.lineTo(cx + 1, cy + 9); ctx.lineTo(cx - 5, cy + 4); ctx.lineTo(cx - 10, cy + 4); ctx.fill();
    ctx.lineWidth = 2;
    if (icon === 'sound') { ctx.beginPath(); ctx.arc(cx + 2, cy, 7, -.8, .8); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(cx + 5, cy - 5); ctx.lineTo(cx + 11, cy + 5); ctx.moveTo(cx + 11, cy - 5); ctx.lineTo(cx + 5, cy + 5); ctx.stroke(); }
  }
}

function overlay(title, sub, buttons, t) {
  ctx.fillStyle = 'rgba(13,11,42,.74)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glow(W / 2, 214, 260, 'rgba(255,157,77,.22)');
  ctx.font = '78px "Lilita One", sans-serif';
  ctx.fillStyle = '#120f36'; ctx.fillText(title, W / 2 + 4, 214 + 5);
  ctx.fillStyle = '#ffd58a'; ctx.fillText(title, W / 2, 214);
  ctx.fillStyle = '#ffe6b8'; ctx.font = '800 20px Nunito, sans-serif'; ctx.globalAlpha = .9;
  sub.forEach((line, i) => ctx.fillText(line, W / 2, 278 + i * 30));
  ctx.globalAlpha = 1;
  buttons.forEach(b => {
    const hov = S.hover && inR(S.hover, b);
    ctx.fillStyle = b.primary ? (hov ? '#ffb066' : '#ff9d4d') : (hov ? '#3a2f78' : '#2a2566');
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 28); ctx.fill();
    ctx.fillStyle = b.primary ? '#3a1d10' : '#ffe6b8'; ctx.font = '26px "Lilita One", sans-serif';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  });
}
const BTN_START = { x: W / 2 - 120, y: 420, w: 240, h: 60, label: 'Light the garden', primary: true };
const BTN_RETRY = { x: W / 2 - 120, y: 420, w: 240, h: 60, label: 'Try again', primary: true };
const BTN_ENDLESS = { x: W / 2 - 260, y: 420, w: 250, h: 60, label: 'Keep defending', primary: true };
const BTN_RESTART = { x: W / 2 + 10, y: 420, w: 250, h: 60, label: 'New game' };

// ---------- render ----------
function render() {
  const t = S.t;
  drawWorld(t);

  // plants
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = S.grid[r][c]; if (!p) continue;
    ctx.save(); ctx.translate(cellX(c) + (p.hit > 0 ? rand(-1, 1) : 0), groundY(r) - 32);
    const pop = Math.min(1, (S.t - p.born) * 6);
    ctx.scale(.6 + .4 * pop, .6 + .4 * pop);
    PLANT_DRAW[p.k](t + c * .7 + r, p);
    ctx.restore();
    if (mode === 'play' && S.sel === 'shovel' && S.hover && hoverCell()?.r === r && hoverCell()?.c === c) {
      ctx.fillStyle = 'rgba(255,80,60,.22)'; ctx.fillRect(GX + c * CW, GY + r * CH, CW, CH);
    }
  }

  // placement ghost
  const hc = mode === 'play' && S.sel && S.sel !== 'shovel' ? hoverCell() : null;
  if (hc && !S.grid[hc.r][hc.c]) {
    ctx.fillStyle = 'rgba(255,200,120,.14)'; ctx.fillRect(GX + hc.c * CW, GY + hc.r * CH, CW, CH);
    ctx.save(); ctx.globalAlpha = .5; ctx.translate(cellX(hc.c), groundY(hc.r) - 32); PLANT_DRAW[S.sel](t, null); ctx.restore();
  }

  // foes, back rows first
  [...S.foes].sort((a, b) => a.row - b.row || b.x - a.x).forEach(drawFoe);

  // shots
  for (const s of S.shots) {
    const fr = s.k === 'frost';
    glow(s.x, s.y, 16, fr ? 'rgba(150,210,255,.8)' : 'rgba(255,230,120,.8)');
    ctx.fillStyle = fr ? 'rgba(170,220,255,.35)' : 'rgba(255,230,140,.3)';
    ctx.beginPath(); ctx.ellipse(s.x - 10, s.y, 10, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = fr ? '#e2f2ff' : '#fff3b0'; ctx.beginPath(); ctx.arc(s.x, s.y, 4.5, 0, 7); ctx.fill();
  }

  // fx
  for (const p of S.fx) {
    const a = Math.max(0, p.life / p.max);
    if (p.type === 'ring') {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = 8 * a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - a * .8), 0, 7); ctx.stroke();
    } else if (p.type === 'bubble') {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle = p.color; ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ambient bubbles
  for (const b of bubbles) {
    const fl = .4 + .6 * Math.abs(Math.sin(t * 2 + b.x * .05));
    glow(b.x, b.y, b.r * 3, `rgba(255,230,140,${.35 * fl})`);
    ctx.fillStyle = `rgba(255,243,176,${.7 * fl})`; ctx.beginPath(); ctx.arc(b.x, b.y, Math.min(2.2, b.r * .5), 0, 7); ctx.fill();
  }

  // pearls
  for (const p of S.pearlsF) {
    if (!p.col && p.life < 2.2 && Math.floor(p.life * 8) % 2) continue;
    ctx.save(); ctx.globalAlpha = .3; ctx.fillStyle = '#fff1c4';
    ctx.beginPath(); ctx.arc(p.x, p.y, 20 + Math.sin(p.spin * 2) * 2, 0, 7); ctx.fill(); ctx.restore();
    pearl(p.x, p.y, 13);
  }

  drawHUD(t);

  // shovel cursor / banner
  if (mode === 'play' && S.sel === 'shovel' && S.hover && S.hover.y > GY) drawShovel(S.hover.x + 10, S.hover.y - 14, .9);
  if (S.banner && mode === 'play') {
    const a = Math.min(1, S.banner.t * 2, (2.6 - S.banner.t) * 4);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '54px "Lilita One", sans-serif';
    ctx.fillStyle = '#120f36'; ctx.fillText(S.banner.text, W / 2 + 3, 330 + 4);
    ctx.fillStyle = S.banner.sub ? '#ff8a6a' : '#ffd58a'; ctx.fillText(S.banner.text, W / 2, 330);
    if (S.banner.sub) {
      ctx.font = '800 22px Nunito, sans-serif';
      ctx.fillStyle = '#120f36'; ctx.fillText(S.banner.sub, W / 2 + 2, 384 + 2);
      ctx.fillStyle = '#ffe6b8'; ctx.fillText(S.banner.sub, W / 2, 384);
    }
    ctx.globalAlpha = 1;
  }

  if (mode === 'title') overlay('LANTERNWALL', ['Shadows are creeping in from the dark. Plant paper lanterns to hold the line.', 'Firefly lanterns gather light · ember lanterns shoot sparks · frost lanterns chill · firecrackers burst'].concat(best ? [`Best so far: night ${best}` + (bestEndless ? ` · endless: night ${bestEndless}` : '')] : []), [BTN_START], t);
  else if (mode === 'over') overlay('Garden lost', [`The shadows reached the teahouse on night ${S.wave}.`, `You banished ${S.kills} shadows.`, S.endless ? (newBest ? `New endless best: night ${bestEndless}!` : `Endless best: night ${bestEndless}`) : newBest ? `New best: night ${best}!` : `Best: night ${best}`], [BTN_RETRY], t);
  else if (mode === 'won') overlay('Dawn breaks!', [`All ${TOTAL_WAVES} nights held. ${S.kills} shadows banished.`, 'Stay on and see how long the lanterns can burn.'], [BTN_ENDLESS, BTN_RESTART], t);
  else if (paused) {
    ctx.fillStyle = 'rgba(13,11,42,.55)'; ctx.fillRect(0, 108, W, H - 108);
    ctx.fillStyle = '#ffd58a'; ctx.textAlign = 'center'; ctx.font = '60px "Lilita One", sans-serif'; ctx.fillText('Paused', W / 2, 350);
  }
}

// ---------- input ----------
function local(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function hoverCell() {
  const h = S.hover; if (!h) return null;
  const c = Math.floor((h.x - GX) / CW), r = Math.floor((h.y - GY) / CH);
  return c >= 0 && c < COLS && r >= 0 && r < ROWS ? { r, c } : null;
}
function selectCard(k) {
  if (mode !== 'play' || paused) return;
  if (k === 'shovel') { S.sel = S.sel === 'shovel' ? null : 'shovel'; return; }
  if (S.sel === k) { S.sel = null; return; }
  if (S.cards[k] > 0 || S.pearls < PLANTS[k].cost) { tone(150, .1, 'square', .03); return; }
  S.sel = k; tone(520, .06, 'triangle', .03);
}
function startGame() { newGame(); mode = 'play'; paused = false; banner('Get ready', null); S.banner.sub = null; }
cv.addEventListener('pointermove', e => { S.hover = local(e); });
cv.addEventListener('pointerleave', () => { S.hover = null; });
cv.addEventListener('pointerdown', e => {
  audio(); cv.focus({ preventScroll: true });
  const p = local(e); S.hover = p;
  if (mode === 'title') { if (inR(p, BTN_START)) startGame(); return; }
  if (mode === 'over') { if (inR(p, BTN_RETRY)) startGame(); return; }
  if (mode === 'won') {
    if (inR(p, BTN_ENDLESS)) { mode = 'play'; S.endless = true; S.waveT = S.waveLen = 8; }
    else if (inR(p, BTN_RESTART)) startGame();
    return;
  }
  if (hitBtn(p, MUTE)) { toggleMute(); return; }
  if (hitBtn(p, PAUSE)) { paused = !paused; return; }
  if (hitBtn(p, FAST)) { fast = !fast; return; }
  if (paused) return;
  for (const pr of S.pearlsF) if (!pr.col && Math.hypot(pr.x - p.x, pr.y - p.y) < 30) { pr.col = true; tone(1046, .12, 'sine', .05, 1.5); return; }
  for (let i = 0; i < ORDER.length; i++) if (inR(p, CARD(i))) { selectCard(ORDER[i]); return; }
  if (inR(p, SHOVEL)) { selectCard('shovel'); return; }
  const hc = hoverCell();
  if (hc && S.sel) {
    const cur = S.grid[hc.r][hc.c];
    if (S.sel === 'shovel') {
      if (cur) { S.grid[hc.r][hc.c] = null; burst(cellX(hc.c), groundY(hc.r) - 20, 10, ['#ff9d4d', '#fff1c4'], 100); tone(260, .12, 'triangle', .04, .6); }
      S.sel = null; return;
    }
    const def = PLANTS[S.sel];
    if (!cur && S.pearls >= def.cost && S.cards[S.sel] <= 0) {
      S.grid[hc.r][hc.c] = { k: S.sel, hp: def.hp, timer: S.sel === 'clam' ? 6 : S.sel === 'puffer' ? 1.1 : 0, hit: 0, fire: 0, born: S.t };
      S.pearls -= def.cost; S.cards[S.sel] = def.cd; S.sel = null;
      burst(cellX(hc.c), groundY(hc.r), 8, ['#ff9d4d', '#fff1c4'], 80);
      tone(330, .1, 'triangle', .05, 1.6);
    }
    return;
  }
  S.sel = null;
});
cv.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '5') selectCard(ORDER[+k - 1]);
  else if (k === 's') selectCard('shovel');
  else if (k === 'p' && mode === 'play') paused = !paused;
  else if (k === 'f' && mode === 'play') fast = !fast;
  else if (k === 'm') toggleMute();
  else if (k === 'escape') S.sel = null;
  else if ((k === 'enter' || k === ' ') && mode !== 'play') { audio(); mode === 'won' ? (mode = 'play', S.endless = true, S.waveT = S.waveLen = 8) : startGame(); }
  else return;
  e.preventDefault();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') paused = true; });

// ---------- loop ----------
let last = performance.now(), fast = false;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // 2x speed runs the simulation twice per frame rather than doubling dt, so collisions stay as precise as at 1x
  update(dt); if (fast && mode === 'play' && !paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
cv.focus({ preventScroll: true });
document.fonts && document.fonts.ready.then(render);
requestAnimationFrame(frame);
})();
</script>
